<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Approve messages &amp; photos — admin</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root{--bg:#fdfbf7;--ink:#5f4b30;--gold:#b8894a;--gold-ink:#7a5a26;--muted:#7f6d53;--line:#efe4cc}
  *{box-sizing:border-box}
  body{margin:0;font:17px/1.5 'Cormorant Garamond',Georgia,serif;color:var(--ink);background:var(--bg)}
  main{max-width:720px;margin:0 auto;padding:28px 16px 60px}
  h1{font-weight:400;font-size:28px;margin:0 0 4px;color:var(--gold-ink)}
  h2{font-size:20px;margin:28px 0 10px;color:var(--gold-ink)}
  p.sub{margin:0 0 20px;color:var(--muted)}
  form{display:flex;gap:8px}
  [hidden]{display:none!important}
  input{flex:1;font:inherit;padding:10px 12px;border:1px solid #e4d4b2;border-radius:10px;background:#fff}
  button{font:500 15px Georgia,serif;padding:10px 16px;border-radius:999px;border:1px solid #e4d4b2;background:#fff;color:var(--gold-ink);cursor:pointer;min-height:42px}
  button.ok{background:var(--gold);border-color:var(--gold);color:#fff}
  button.no{color:#9a4632}
  .card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px;margin-bottom:10px}
  .card img{max-width:100%;max-height:220px;display:block;margin:4px 0}
  .meta{font-size:14px;color:var(--muted)}
  .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  #status{min-height:1.5em;color:var(--muted)}
  .photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .photo{border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px;display:flex;flex-direction:column;gap:6px}
  .photo img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;cursor:zoom-in}
  .photo .row{margin-top:0;gap:6px}
  .photo button{flex:1;min-height:36px;padding:6px 8px}
  .empty{color:var(--muted);font-style:italic;margin:4px 0 8px}
  .gone{opacity:.35;transition:opacity .25s}
  .tabs{position:sticky;top:0;z-index:2;display:flex;gap:8px;padding:10px 0;background:var(--bg)}
  .tab{flex:1;text-align:center;text-decoration:none;color:var(--gold-ink);border:1px solid #e4d4b2;border-radius:999px;padding:8px 10px;background:#fff}
  .tab b{display:inline-block;min-width:1.6em;margin-left:4px;border-radius:999px;background:var(--gold);color:#fff;font-weight:500;font-size:14px;padding:0 6px}
  .bulk{margin:0 0 10px}
</style>
</head>
<body>
<main>
  <h1>Messages &amp; photos</h1>
  <p class="sub">Nothing appears on the invitation until you approve it here.</p>
  <form id="login"><input type="password" id="key" placeholder="Admin key" autocomplete="current-password" required><button class="ok">Open</button></form>
  <p id="status" role="status"></p>
  <section id="lists" hidden>
    <nav class="tabs">
      <a href="#waiting" class="tab">Waiting <b id="nWaiting">0</b></a>
      <a href="#onsite" class="tab">On the site <b id="nOnsite">0</b></a>
    </nav>

    <h2 id="waiting">Photos waiting for approval <span id="nPendingPhotos"></span></h2>
    <div class="row bulk" id="bulkPhotos" hidden><button class="ok" id="approveAllPhotos">Approve all photos</button></div>
    <div class="photos" id="pendingPhotos"></div>

    <h2>Messages waiting for approval <span id="nPending"></span></h2>
    <div id="pending"></div>

    <h2 id="onsite">Photos in the gallery <span id="nPhotos"></span></h2>
    <div class="photos" id="photos"></div>

    <h2>Messages on the board <span id="nPublished"></span></h2>
    <div id="published"></div>
  </section>
</main>
<script>
let KEY = sessionStorage.getItem('hm-admin') || '';
const $ = s => document.querySelector(s);
const call = (init = {}) => fetch('/api/moderate', { ...init, headers: { 'x-admin-key': KEY, 'Content-Type': 'application/json' } })
  .then(async r => { if (!r.ok) throw new Error(r.status === 401 ? 'Wrong key.' : 'Error ' + r.status); return r.json(); });
const act = (id, action) => call({ method: 'POST', body: JSON.stringify({ id, action }) });
const empty = text => { const p = document.createElement('p'); p.className = 'empty'; p.textContent = text; return p; };

/** A row of action buttons; `danger` actions ask first because they cannot be undone. */
function actions(id, list, el) {
  const row = document.createElement('div'); row.className = 'row';
  list.forEach(([label, action, cls, danger]) => {
    const b = document.createElement('button'); b.textContent = label; b.className = cls;
    b.onclick = async () => {
      if (danger && !confirm(danger)) return;
      row.querySelectorAll('button').forEach(x => x.disabled = true);
      try { await act(id, action); el.classList.add('gone'); setTimeout(load, 250); }
      catch (err) { $('#status').textContent = err.message; row.querySelectorAll('button').forEach(x => x.disabled = false); }
    };
    row.append(b);
  });
  return row;
}
function card(e, list) {
  const d = document.createElement('div'); d.className = 'card';
  if (e.drawing) { const i = new Image(); i.src = e.drawing; i.alt = 'Handwritten message'; d.append(i); }
  if (e.message) { const p = document.createElement('p'); p.textContent = e.message; p.style.margin = '0'; d.append(p); }
  const m = document.createElement('p'); m.className = 'meta'; m.textContent = `— ${e.name} · ${new Date(e.createdAt).toLocaleString()}`; d.append(m);
  d.append(actions(e.id, list, d)); return d;
}
function photo(p, list) {
  const d = document.createElement('div'); d.className = 'photo';
  const img = new Image(); img.src = p.thumb; img.alt = 'Guest photo'; img.loading = 'lazy'; img.onclick = () => open(p.url, '_blank');
  d.append(img, actions(p.id, list, d)); return d;
}
const fill = (sel, items, make, none) => $(sel).replaceChildren(...(items.length ? items.map(make) : [empty(none)]));

let PENDING_PHOTOS = [];
async function load() {
  $('#status').textContent = 'Loading…';
  try {
    const { pending, published, pendingPhotos, photos } = await call();
    PENDING_PHOTOS = pendingPhotos;
    fill('#pendingPhotos', pendingPhotos, p => photo(p, [['Approve', 'approve-photo', 'ok'], ['Reject', 'reject-photo', 'no', 'Delete this photo? It will never appear on the site.']]), 'No photos waiting.');
    fill('#pending', pending, e => card(e, [['Approve', 'approve', 'ok'], ['Reject', 'reject', 'no', 'Delete this message? It will never appear on the site.']]), 'No messages waiting.');
    fill('#photos', photos, p => photo(p, [['Remove', 'remove-photo', 'no', 'Remove this photo from the gallery? This cannot be undone.']]), 'No photos on the site yet.');
    fill('#published', published, e => card(e, [['Remove', 'remove', 'no', 'Remove this message from the board? This cannot be undone.']]), 'No messages on the site yet.');
    $('#nPendingPhotos').textContent = `(${pendingPhotos.length})`; $('#nPending').textContent = `(${pending.length})`;
    $('#nPhotos').textContent = `(${photos.length})`; $('#nPublished').textContent = `(${published.length})`;
    $('#nWaiting').textContent = pendingPhotos.length + pending.length; $('#nOnsite').textContent = photos.length + published.length;
    $('#bulkPhotos').hidden = pendingPhotos.length < 2;
    $('#lists').hidden = false; $('#login').hidden = true; $('#status').textContent = '';
    sessionStorage.setItem('hm-admin', KEY);
  } catch (err) { $('#status').textContent = err.message; $('#login').hidden = false; }
}
$('#approveAllPhotos').onclick = async e => {
  const b = e.currentTarget; b.disabled = true;
  let done = 0;
  for (const p of PENDING_PHOTOS) { try { await act(p.id, 'approve-photo'); done++; $('#status').textContent = `Approved ${done} / ${PENDING_PHOTOS.length}…`; } catch {} }
  b.disabled = false; load();
};
$('#login').onsubmit = e => { e.preventDefault(); KEY = $('#key').value.trim(); load(); };
if (KEY) load();
</script>
</body>
</html>
